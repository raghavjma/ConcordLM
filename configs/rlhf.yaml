# ============================================================
# ConcordLM — RLHF Configuration
# Stage 3 (Optional): Reward model + Policy optimization
#
# TRL v1.0 — Uses GRPOTrainer (Group Relative Policy Optimization)
# which replaces the deprecated PPOTrainer.
# ============================================================

inherit: base.yaml

stage: "rlhf"
method: "grpo"                       # "grpo" (recommended) | "rloo"

training:
  output_dir: "./outputs/rlhf"
  learning_rate: 1.0e-6
  num_train_epochs: 1
  max_steps: -1

reward_model:
  output_dir: "./outputs/reward_model"
  learning_rate: 1.0e-5
  num_train_epochs: 1
  per_device_train_batch_size: 4
  max_length: 512

grpo:
  num_generations: 4                 # Completions per prompt (higher = better but slower)
  max_completion_length: 256         # Max tokens per completion
  temperature: 0.7
  top_p: 0.9
  beta: 0.04                        # KL penalty coefficient
  num_iterations: 1                  # GRPO iterations per batch
  loss_type: "grpo"                  # "grpo" | "dapo" | "dr_grpo"
  scale_rewards: "group"             # "group" | "none" | "running_mean"

data:
  dataset_name: "trl-lib/ultrafeedback_binarized"
  dataset_split: "train"

# Paths to prior stage outputs
sft_model_path: null                 # Path to SFT model
dpo_model_path: null                 # Optional: start from DPO model instead

# Pre-trained reward model (if not training your own)
reward_model_name_or_path: null      # e.g., "weqweasdas/RM-Gemma-2B"
